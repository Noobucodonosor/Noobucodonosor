name: Deploy Static Hub (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'showcase.config.json'
      - 'scripts/build-bundles.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Offline Kit bundle & stage Pages artifact
        run: |
          node scripts/build-bundles.mjs
          mkdir -p _site/bundles
          cp -R web/* _site/
          cp bundles/noobucodonosor-portable.html _site/bundles/noobucodonosor-portable.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
