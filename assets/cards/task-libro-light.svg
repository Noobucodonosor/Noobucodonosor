        <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v16h5.5a2.5 2.5 0 0 1 2.5 2V5.5z" />
      </g>
  <text x="148" y="30" class="mono arrow-nudge" font-size="13" font-weight="700" fill="#6366f1">→</text>
  <text x="14" y="62" class="sans" font-size="14" font-weight="700" fill="#1f2328">Leggi Libro</text>
