<svg xmlns="http://www.w3.org/2000/svg" width="286" height="164" viewBox="0 0 286 164" role="img" aria-label="Binario Web Live">
  <defs><style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes barRise {
      from { transform: scaleY(0.05); }
      to { transform: scaleY(1); }
    }
    @keyframes pulseOpacity {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes arrowSlide {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(3px); }
    }
    .line-reveal {
      opacity: 0;
      animation: fadeSlideIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .bar-grow {
      transform-box: fill-box;
      transform-origin: bottom;
      animation: barRise 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .pulse-dot {
      animation: pulseOpacity 2.2s ease-in-out infinite;
    }
    .arrow-nudge {
      animation: arrowSlide 2s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .line-reveal, .bar-grow, .pulse-dot, .arrow-nudge {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style></defs>
  <rect x="0.5" y="0.5" width="285" height="163" rx="10" fill="#161b22" stroke="#30363d" />
  <text x="16" y="28" class="mono" font-size="11" font-weight="700" fill="#58a6ff">BINARIO 01 · CLOUD RUN</text>
  <circle cx="204" cy="24" r="4" fill="#d29922" class="pulse-dot" />
  <text x="213" y="28" class="mono" font-size="10" font-weight="600" fill="#d29922">HTTP 404</text>
  <text x="16" y="56" class="sans" font-size="17" font-weight="700" fill="#f0f6fc">Hub &amp; Assistente AI</text>
  <text x="16" y="78" class="sans" font-size="12" fill="#8b949e">4 Playground prescaricati + 5 flussi</text>
  <text x="16" y="96" class="sans" font-size="12" fill="#8b949e">Pool API free-tier con cache &amp; BYOK</text>
  <rect x="16" y="114" width="78" height="22" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="25" y="129" class="mono" font-size="10" fill="#f0f6fc">ADR-0002</text>
  <rect x="102" y="114" width="78" height="22" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="111" y="129" class="mono" font-size="10" fill="#f0f6fc">ADR-0003</text>
  <text x="242" y="130" class="mono arrow-nudge" font-size="13" font-weight="700" fill="#58a6ff">↗</text>
</svg>
