        <text x="46" y="160" class="mono" font-size="13" fill="#8b949e">vetrina: 8 prodotti verticali | 1 aggiornati oggi | 58 commit (7g)</text>
      </g>
  <g class="line-reveal" style="animation-delay: 54ms">
