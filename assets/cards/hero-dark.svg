<svg xmlns="http://www.w3.org/2000/svg" width="880" height="224" viewBox="0 0 880 224" role="img" aria-label="Noobucodonosor Terminal HUD">
  <defs>
    <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes barRise {
      from { transform: scaleY(0.05); }
      to { transform: scaleY(1); }
    }
    @keyframes pulseOpacity {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes arrowSlide {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(3px); }
    }
    .line-reveal {
      opacity: 0;
      animation: fadeSlideIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .bar-grow {
      transform-box: fill-box;
      transform-origin: bottom;
      animation: barRise 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .pulse-dot {
      animation: pulseOpacity 2.2s ease-in-out infinite;
    }
    .arrow-nudge {
      animation: arrowSlide 2s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .line-reveal, .bar-grow, .pulse-dot, .arrow-nudge {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
    <linearGradient id="hero-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f6fc" />
      <stop offset="45%" stop-color="#58a6ff" />
      <stop offset="55%" stop-color="#f0f6fc" />
      <stop offset="100%" stop-color="#f0f6fc" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="2 0" dur="4.2s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="223" rx="12" fill="#161b22" stroke="#30363d" />
  <rect x="1" y="1" width="878" height="36" rx="11" fill="#1c2128" />
  <line x1="1" y1="37" x2="879" y2="37" stroke="#21262d" />
  <circle cx="22" cy="19" r="5" fill="#ff5f56" />
  <circle cx="38" cy="19" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="19" r="5" fill="#27c93f" />
  <text x="74" y="23" class="mono" font-size="12" fill="#8b949e">noobucodonosor@genova:~ — terminal-hud</text>
  <rect x="724" y="9" width="140" height="20" rx="10" fill="#21262d" stroke="#30363d" />
  <circle cx="738" cy="19" r="4" fill="#3fb950" class="pulse-dot" />
  <text x="748" y="23" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">HUB ONLINE 397ms</text>

  <text x="28" y="76" class="sans" font-size="26" font-weight="800" letter-spacing="-0.5" fill="url(#hero-shine)">Noobucodonosor — Control Deck</text>
  <g class="line-reveal" style="animation-delay: 0ms">
        <text x="28" y="114" class="mono" font-size="13" font-weight="700" fill="#58a6ff">$</text>
        <text x="46" y="114" class="mono" font-size="13" fill="#8b949e">whoami --profile noobucodonosor --region &quot;Genova · Rapallo&quot;</text>
      </g>
  <g class="line-reveal" style="animation-delay: 18ms">
        <text x="28" y="137" class="mono" font-size="13" font-weight="700" fill="#58a6ff">&gt;</text>
        <text x="46" y="137" class="mono" font-size="13" fill="#f0f6fc">Consulenza IT · Sistemi di AI Agentica · Prodotti Digitali</text>
      </g>
  <g class="line-reveal" style="animation-delay: 36ms">
