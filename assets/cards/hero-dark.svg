        <text x="46" y="183" class="mono" font-size="13" fill="#8b949e">hub-cloud-run: ONLINE 397ms | kit-offline: bundles/noobucodonosor-portable.html | sync: 27 nov 2026, 06:05</text>
      </g>
</svg>
