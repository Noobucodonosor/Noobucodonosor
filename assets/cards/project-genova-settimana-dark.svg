  <text x="22" y="62" class="sans" font-size="21" font-weight="800" fill="#f0f6fc">Cosa faccio questa settimana a Genova</text>
  <text x="22" y="88" class="sans" font-size="13" fill="#8b949e">Cinema, mostre, musica, biblioteche, ~5.000 attività locali e storia delle vie su 67 comuni.</text>
